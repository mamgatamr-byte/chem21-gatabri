<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة قطابري الخيرية لإتقان كيمياء 2-1</title>
<style>
:root{--primary:#0e7c3a;--primary-dark:#0a5f2c;--positive:#198038;--error:#da1e28;--warning:#b28600;--bg:#fff;--surface:#f4f4f4;--surface-high:#e0e0e0;--text:#161616;--text-sec:#525252;--border:#e0e0e0;--radius:4px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
body{display:flex;flex-direction:column;min-height:100vh}
header{background:var(--surface);padding:1rem 2rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.brand h1{margin:0;font-size:1.15rem;font-weight:700;color:var(--primary)}
.brand .sub{font-size:.82rem;color:var(--text-sec);margin-top:2px}
.header-actions{display:flex;gap:.5rem;flex-wrap:wrap}
main{flex:1;max-width:1280px;margin:0 auto;padding:1.5rem 1rem;width:100%}
footer{text-align:center;padding:1rem;color:var(--text-sec);font-size:.82rem;border-top:1px solid var(--border);margin-top:2rem}
button,a.btn{font-family:inherit;font-size:.92rem;padding:.55rem 1rem;border-radius:var(--radius);border:1px solid transparent;cursor:pointer;background:var(--surface);color:var(--text);transition:.15s;text-decoration:none;display:inline-block;text-align:center}
button:hover,a.btn:hover{background:var(--surface-high)}
button.primary{background:var(--primary);color:#fff}
button.primary:hover{background:var(--primary-dark)}
button.danger{background:var(--error);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem}
.progress-bar{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin:.5rem 0}
.progress-bar>div{height:100%;background:var(--primary);transition:width .3s}
.progress-bar.big{height:14px;border-radius:7px}
.muted{color:var(--text-sec);font-size:.85rem}
.hidden{display:none}
.storage-warn{background:#fff3e0;border:1px solid var(--warning);color:#7a4f00;padding:.7rem 1rem;border-radius:var(--radius);font-size:.85rem;margin-bottom:1rem}
.info-banner{background:#edf7f0;border:1px solid #198038;color:#0a5f2c;padding:.8rem 1rem;border-radius:var(--radius);font-size:.88rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.info-banner strong{color:#0a5f2c}
.dashboard{display:grid;grid-template-columns:30% 70%;gap:1.5rem;align-items:start}
.lessons-col h2{margin:0 0 1rem;font-size:1.15rem}
.chapter-group{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:.7rem;overflow:hidden;background:#fff}
.chapter-group.locked{opacity:.65}
.chapter-toggle{padding:.8rem 1rem;background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:.5rem;cursor:pointer;width:100%;border:none;font-family:inherit;font-size:.9rem;text-align:right;color:var(--text)}
.chapter-toggle:hover{background:var(--surface-high)}
.chapter-toggle.locked{cursor:not-allowed}
.chapter-toggle.locked:hover{background:var(--surface)}
.chapter-code{font-family:monospace;font-size:.72rem;color:var(--primary);background:#edf7f0;padding:1px 6px;border-radius:3px;font-weight:600;margin-left:4px}
.chapter-toggle.locked .chapter-code{color:var(--text-sec);background:var(--surface-high)}
.chapter-name{font-weight:600}
.chapter-meta-small{font-size:.72rem;color:var(--text-sec);margin-top:2px}
.chapter-chevron{font-size:.8rem;color:var(--text-sec);transition:transform .2s;flex-shrink:0}
.chapter-group.open .chapter-chevron{transform:rotate(180deg)}
.chapter-lessons{display:none;padding:.5rem}
.chapter-group.open .chapter-lessons{display:block}
.lesson-btn{display:flex;align-items:center;gap:.5rem;padding:.65rem .7rem;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:.4rem;background:#fff;width:100%;font-family:inherit;font-size:.85rem;text-align:right;color:var(--text);transition:.15s;cursor:pointer;text-decoration:none}
.lesson-btn.available:hover{border-color:var(--primary);background:#f5fbf7}
.lesson-btn.available{cursor:pointer}
.lesson-btn.locked{opacity:.6;cursor:not-allowed}
.lesson-btn.mastered{border-color:var(--positive);background:#edf7f0}
.lesson-btn.preparing{cursor:not-allowed;opacity:.8}
.lesson-mini-code{font-family:monospace;font-size:.7rem;font-weight:600;color:var(--primary);background:#edf7f0;padding:1px 5px;border-radius:3px;flex-shrink:0}
.lesson-btn.locked .lesson-mini-code{color:var(--text-sec);background:var(--surface)}
.lesson-btn.mastered .lesson-mini-code{color:var(--positive);background:#d5eedd}
.lesson-btn.preparing .lesson-mini-code{color:var(--warning);background:#fff3e0}
.lesson-info-mini{flex:1;min-width:0}
.lesson-name-mini{font-weight:600;font-size:.82rem;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson-meta-mini{font-size:.7rem;color:var(--text-sec)}
.lesson-status-mini{font-size:.65rem;font-weight:600;padding:1px 5px;border-radius:999px;white-space:nowrap;flex-shrink:0}
.status-available{background:#edf7f0;color:var(--primary)}
.status-locked{background:var(--surface-high);color:var(--text-sec)}
.status-mastered{background:#edf7f0;color:var(--positive)}
.status-preparing{background:#fff3e0;color:var(--warning)}
.mini-pbar{height:3px;background:var(--surface);border-radius:2px;overflow:hidden;margin-top:3px}
.mini-pbar>div{height:100%;background:var(--primary)}
.lesson-btn.mastered .mini-pbar>div{background:var(--positive)}
.report-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem}
.report-header h2{margin:0;font-size:1.15rem}
.report-actions{display:flex;gap:.5rem}
.report-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-bottom:1rem}
.report-name{font-size:1.4rem;font-weight:700;margin:0 0 .3rem}
.report-dates{font-size:.85rem;color:var(--text-sec);margin-bottom:1rem}
.report-total{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:.5rem;margin-bottom:.4rem}
.report-total-label{font-weight:600;font-size:.95rem}
.report-total-value{font-family:monospace;font-size:1.1rem;font-weight:700;color:var(--primary)}
.report-total-note{font-size:.78rem;color:var(--text-sec);margin-top:.3rem}
.report-section-title{font-size:1rem;font-weight:700;margin:1.2rem 0 .6rem;color:var(--primary);border-bottom:2px solid var(--primary);padding-bottom:.3rem}
.chapter-progress{display:flex;align-items:center;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--border);font-size:.88rem;gap:.5rem}
.chapter-progress:last-child{border-bottom:none}
.chapter-progress-name{font-weight:600;flex:1}
.chapter-progress-bar{flex:0 0 100px;height:6px;background:var(--surface);border-radius:3px;overflow:hidden}
.chapter-progress-bar>div{height:100%;background:var(--primary)}
.chapter-progress-val{font-family:monospace;font-size:.78rem;color:var(--text-sec);min-width:50px;text-align:left}
.chapter-progress.complete .chapter-progress-bar>div{background:var(--positive)}
.chapter-progress.complete .chapter-progress-val{color:var(--positive);font-weight:600}
.last-mastered{background:#edf7f0;border-right:4px solid var(--positive);padding:.9rem 1rem;border-radius:var(--radius);margin-bottom:1rem}
.last-mastered-title{font-size:.78rem;color:var(--positive);font-weight:600;margin-bottom:.2rem}
.last-mastered-text{font-size:.92rem}
.cert-list{list-style:none;padding:0;margin:0}
.cert-item{padding:.5rem .7rem;background:#edf7f0;border-right:3px solid var(--primary);border-radius:var(--radius);margin-bottom:.4rem;font-size:.85rem}
.cert-item-title{font-weight:600;color:var(--primary)}
.cert-item-code{font-family:monospace;font-size:.72rem;color:var(--text-sec);margin-top:2px}
.welcome-card{max-width:560px;margin:3rem auto}
.empty-state{text-align:center;padding:2rem 1rem;color:var(--text-sec)}
.empty-state .icon{font-size:3rem;margin-bottom:.5rem}
.empty-state h3{color:var(--primary);margin:.5rem 0}
.empty-state p{font-size:.9rem;max-width:500px;margin:.5rem auto}
.code-hint{background:var(--surface);padding:.4rem .7rem;border-radius:3px;font-family:monospace;font-size:.85rem;color:var(--primary);display:inline-block;margin:2px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal-content{background:#fff;border-radius:var(--radius);padding:1.5rem;max-width:520px;width:100%;max-height:90vh;overflow-y:auto}
.modal-close{float:left;background:transparent;border:1px solid var(--border);padding:.3rem .7rem;font-size:.85rem}
/* BiDi isolation */
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
bdi{unicode-bidi:isolate}
@media print{
  body{background:#fff}
  header,footer,.lessons-col,.report-actions,.no-print,.modal-overlay,.storage-warn,.info-banner{display:none!important}
  main{max-width:100%;padding:0;margin:0}
  .dashboard{display:block}
  .report-col{width:100%}
  .report-card{border:none;padding:0;margin-bottom:1.5rem;page-break-inside:avoid}
  .print-only{display:block!important;text-align:center;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:2px solid #000}
  .print-only h1{margin:0;font-size:1.6rem;color:#000}
  .print-only .print-sub{font-size:.9rem;color:#333;margin-top:.3rem}
  .report-section-title{color:#000;border-color:#000}
  .chapter-progress-bar>div{background:#000!important}
  .chapter-progress.complete .chapter-progress-bar>div{background:#000!important}
  .last-mastered{background:#f5f5f5!important;border-color:#000!important}
  .last-mastered-title{color:#000!important}
  .cert-item{background:#f5f5f5!important;border-color:#000!important}
  .cert-item-title{color:#000!important}
  .print-footer{display:block!important;margin-top:2rem;padding-top:1rem;border-top:1px solid #000;text-align:center;font-size:.85rem}
  @page{margin:1.5cm;size:A4}
}
.print-only,.print-footer{display:none}
@media(max-width:900px){.dashboard{grid-template-columns:1fr}main{padding:1rem .8rem}header{padding:.8rem 1rem}.brand h1{font-size:1rem}.report-card{padding:1rem}.report-name{font-size:1.15rem}.chapter-progress-bar{flex-basis:70px}}
@media(max-width:480px){.header-actions button{font-size:.8rem;padding:.4rem .6rem}.report-actions button{font-size:.8rem;padding:.4rem .7rem}.chapter-progress{font-size:.8rem}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>منصة قطابري الخيرية لإتقان كيمياء 2-1</h1>
    <div class="sub">المعلم محمد قطابري راجحي · مجمع العز التعليمي</div>
  </div>
  <div class="header-actions">
    <button id="btn-settings" class="hidden">⚙️ الإعدادات</button>
    <button id="btn-change-name" class="hidden">✏️ تغيير الاسم</button>
  </div>
</header>
<main id="view"></main>
<footer>مجمع العز التعليمي · تعلّم حتى الإتقان — مجانًا للجميع</footer>

<div class="modal-overlay" id="modal-settings">
  <div class="modal-content">
    <button class="modal-close" onclick="document.getElementById('modal-settings').classList.remove('open')">إغلاق ✕</button>
    <h2 style="margin-top:0">الإعدادات</h2>
    <p class="muted">محرك التخزين: <b id="storage-backend">—</b></p>
    <h3>النسخ الاحتياطي</h3>
    <p class="muted">صدّر بياناتك للاحتفاظ بها أو نقلها لجهاز آخر.</p>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem">
      <button id="btn-export" class="primary">تصدير نسخة</button>
      <label style="display:inline-block"><input type="file" id="import-file" accept=".json" style="display:none"><button id="btn-import">استيراد نسخة</button></label>
    </div>
    <h3 style="margin-top:1.5rem">إعادة التعيين</h3>
    <p class="muted">يمسح كل بياناتك نهائيًا (الاسم، التقدم، الشهادات).</p>
    <button id="btn-reset" class="danger">مسح كل البيانات</button>
  </div>
</div>

<script nomodule>
document.getElementById('view').innerHTML = '<div class="card"><h2>متصفحك قديم</h2><p>تحتاج Chrome 61+ أو Firefox 60+ أو Safari 11+ أو Edge 16+.</p></div>';
</script>
<script type="module">
/* ============================================================
   منهج كيمياء 2-1 (نظام المسارات) — 7 فصول · 27 درسًا
   رمز المنهج: C21
   ملاحظة: objCount تقديري مبدئي. جميع built: true مؤقتًا.
   ============================================================ */
const CURRICULUM = {
  course: 'كيمياء 2-1',
  prefix: 'C21',
  chapters: [
    { id: 'A', order: 1, label: 'الأول', title: 'الإلكترونات في الذرة', lessons: [
      { n: 1, code: 'C21A1', title: 'الضوء وطاقة الكم', file: 'C21A1.html', objCount: 6, built: true },
      { n: 2, code: 'C21A2', title: 'نظرية الكم والذرة', file: 'C21A2.html', objCount: 6, built: true },
      { n: 3, code: 'C21A3', title: 'التوزيع الإلكتروني', file: 'C21A3.html', objCount: 6, built: true },
      { n: 4, code: 'C21A4', title: 'الكيمياء والصحة: ملاقط الليزر', file: 'C21A4.html', objCount: 4, built: true }
    ]},
    { id: 'B', order: 2, label: 'الثاني', title: 'الجدول الدوري والتدرج في خواص العناصر', lessons: [
      { n: 1, code: 'C21B1', title: 'تطور الجدول الدوري الحديث', file: 'C21B1.html', objCount: 6, built: true },
      { n: 2, code: 'C21B2', title: 'تصنيف العناصر', file: 'C21B2.html', objCount: 6, built: true },
      { n: 3, code: 'C21B3', title: 'تدرج خواص العناصر', file: 'C21B3.html', objCount: 6, built: true },
      { n: 4, code: 'C21B4', title: 'الكيمياء والصحة: العناصر في جسم الإنسان', file: 'C21B4.html', objCount: 4, built: true }
    ]},
    { id: 'C', order: 3, label: 'الثالث', title: 'المركبات الأيونية والفلزات', lessons: [
      { n: 1, code: 'C21C1', title: 'تكون الأيون', file: 'C21C1.html', objCount: 6, built: true },
      { n: 2, code: 'C21C2', title: 'الروابط الأيونية والمركبات الأيونية', file: 'C21C2.html', objCount: 6, built: true },
      { n: 3, code: 'C21C3', title: 'صيغ المركبات الأيونية وأسماؤها', file: 'C21C3.html', objCount: 6, built: true },
      { n: 4, code: 'C21C4', title: 'الروابط الفلزية وخواص الفلزات', file: 'C21C4.html', objCount: 6, built: true },
      { n: 5, code: 'C21C5', title: 'الكيمياء في واقع الحياة: الموضة القاتلة', file: 'C21C5.html', objCount: 4, built: true }
    ]},
    { id: 'D', order: 4, label: 'الرابع', title: 'الروابط التساهمية', lessons: [
      { n: 1, code: 'C21D1', title: 'الرابطة التساهمية', file: 'C21D1.html', objCount: 6, built: true },
      { n: 2, code: 'C21D2', title: 'تسمية الجزيئات', file: 'C21D2.html', objCount: 6, built: true },
      { n: 3, code: 'C21D3', title: 'التراكيب الجزيئية', file: 'C21D3.html', objCount: 6, built: true },
      { n: 4, code: 'C21D4', title: 'أشكال الجزيئات', file: 'C21D4.html', objCount: 6, built: true },
      { n: 5, code: 'C21D5', title: 'الكهروسالبية والقطبية', file: 'C21D5.html', objCount: 6, built: true },
      { n: 6, code: 'C21D6', title: 'كيف تعمل الأشياء؟ الأقدام اللاصقة للبرص', file: 'C21D6.html', objCount: 4, built: true }
    ]},
    { id: 'E', order: 5, label: 'الخامس', title: 'الحسابات الكيميائية', lessons: [
      { n: 1, code: 'C21E1', title: 'الصيغة الأولية والصيغة الجزيئية', file: 'C21E1.html', objCount: 6, built: true },
      { n: 2, code: 'C21E2', title: 'صيغ الأملاح المائية', file: 'C21E2.html', objCount: 6, built: true },
      { n: 3, code: 'C21E3', title: 'المقصود بالحسابات الكيميائية', file: 'C21E3.html', objCount: 6, built: true },
      { n: 4, code: 'C21E4', title: 'حسابات المعادلات الكيميائية', file: 'C21E4.html', objCount: 6, built: true },
      { n: 5, code: 'C21E5', title: 'المادة المحددة للتفاعل', file: 'C21E5.html', objCount: 6, built: true },
      { n: 6, code: 'C21E6', title: 'نسبة المردود المئوية', file: 'C21E6.html', objCount: 6, built: true },
      { n: 7, code: 'C21E7', title: 'الكيمياء والصحة: محاربة السلالات المقاومة', file: 'C21E7.html', objCount: 4, built: true }
    ]},
    { id: 'F', order: 6, label: 'السادس', title: 'حالات المادة', lessons: [
      { n: 1, code: 'C21F1', title: 'الغازات', file: 'C21F1.html', objCount: 6, built: true },
      { n: 2, code: 'C21F2', title: 'قوى التجاذب', file: 'C21F2.html', objCount: 6, built: true },
      { n: 3, code: 'C21F3', title: 'المواد السائلة والمواد الصلبة', file: 'C21F3.html', objCount: 6, built: true },
      { n: 4, code: 'C21F4', title: 'تغيرات الحالة الفيزيائية', file: 'C21F4.html', objCount: 6, built: true },
      { n: 5, code: 'C21F5', title: 'الكيمياء في واقع الحياة: كيمياء الكاكاو', file: 'C21F5.html', objCount: 4, built: true }
    ]},
    { id: 'G', order: 7, label: 'السابع', title: 'قوانين الغازات', lessons: [
      { n: 1, code: 'C21G1', title: 'قوانين الغازات', file: 'C21G1.html', objCount: 6, built: true },
      { n: 2, code: 'C21G2', title: 'قانون الغاز المثالي', file: 'C21G2.html', objCount: 6, built: true },
      { n: 3, code: 'C21G3', title: 'الحسابات المتعلقة بالغازات', file: 'C21G3.html', objCount: 6, built: true },
      { n: 4, code: 'C21G4', title: 'الكيمياء والصحة: الصحة والضغط', file: 'C21G4.html', objCount: 4, built: true }
    ]}
  ]
};

const TOTAL_OBJECTIVES = CURRICULUM.chapters.reduce((sum, ch) =>
  sum + ch.lessons.reduce((s, l) => s + l.objCount, 0), 0);

const DB_NAME = 'chem21-shared';
const Store = (() => {
  let backend = null, db = null;
  const mem = { student: [], progress: [], attempts: [], certificates: [] };
  function tryIDB() {
    return new Promise((resolve) => {
      let req;
      try { req = indexedDB.open(DB_NAME, 1); } catch (e) { resolve(false); return; }
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('student')) d.createObjectStore('student', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('progress')) d.createObjectStore('progress', { keyPath: 'objectiveId' });
        if (!d.objectStoreNames.contains('attempts')) d.createObjectStore('attempts', { keyPath: 'id', autoIncrement: true });
        if (!d.objectStoreNames.contains('certificates')) d.createObjectStore('certificates', { keyPath: 'id' });
      };
      req.onsuccess = e => { db = e.target.result; resolve(true); };
      req.onerror = () => resolve(false);
      req.onblocked = () => resolve(false);
    });
  }
  function tryLS() { try { localStorage.setItem('__ct2__', '1'); localStorage.removeItem('__ct2__'); return true; } catch (e) { return false; } }
  function lsAll(s) { try { return JSON.parse(localStorage.getItem(DB_NAME + ':' + s) || '[]'); } catch (e) { return []; } }
  function lsSave(s, a) { try { localStorage.setItem(DB_NAME + ':' + s, JSON.stringify(a)); } catch (e) {} }
  return {
    get backend() { return backend; },
    open: async function() {
      if (await tryIDB()) { backend = 'idb'; return; }
      if (tryLS()) { backend = 'ls'; return; }
      backend = 'mem';
    },
    getAll: async function(s) {
      if (backend === 'idb') return new Promise((res, rej) => { const tx = db.transaction(s, 'readonly'); const r = tx.objectStore(s).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
      if (backend === 'ls') return lsAll(s);
      return mem[s].slice();
    },
    put: async function(s, v) {
      if (backend === 'idb') return new Promise((res, rej) => { const tx = db.transaction(s, 'readwrite'); const r = tx.objectStore(s).put(v); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
      const kf = s === 'progress' ? 'objectiveId' : 'id';
      if (backend === 'ls') {
        const a = lsAll(s);
        if (s === 'attempts') { v.id = Date.now() + Math.random(); a.push(v); }
        else { const i = a.findIndex(x => x[kf] === v[kf]); if (i >= 0) a[i] = v; else a.push(v); }
        lsSave(s, a); return;
      }
      if (s === 'attempts') { v.id = Date.now() + Math.random(); mem[s].push(v); }
      else { const i = mem[s].findIndex(x => x[kf] === v[kf]); if (i >= 0) mem[s][i] = v; else mem[s].push(v); }
    },
    clear: async function(s) {
      if (backend === 'idb') return new Promise((res, rej) => { const tx = db.transaction(s, 'readwrite'); const r = tx.objectStore(s).clear(); r.onsuccess = () => res(); r.onerror = () => rej(r.error); });
      if (backend === 'ls') { lsSave(s, []); return; }
      mem[s] = [];
    }
  };
})();

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function todayHijri() { try { return new Date().toLocaleDateString('ar-SA-u-ca-islamic'); } catch (e) { return new Date().toLocaleDateString('ar-SA'); } }
function todayGreg() { return new Date().toLocaleDateString('ar-SA-u-ca-gregory'); }
function formatDate(ts) { if (!ts) return '—'; try { return new Date(ts).toLocaleDateString('ar-SA-u-ca-islamic') + ' هـ'; } catch (e) { return '—'; } }
function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0; return Math.abs(h).toString(36).toUpperCase().slice(0, 8); }
function genCertId(type, subject) { return 'K21-' + type + '-' + subject + '-' + hashStr(String(Date.now()) + Math.random()); }

function lessonIdFromCode(code) {
  const m = String(code).match(/^C21([A-G])(\d+)$/);
  if (!m) return null;
  const chapterNum = m[1].charCodeAt(0) - 64;
  return chapterNum + '-' + m[2];
}
function lessonIdFromObjective(objectiveId) {
  if (!objectiveId) return null;
  const parts = String(objectiveId).split('-');
  if (parts.length < 2) return null;
  return parts[0] + '-' + parts[1];
}
function storageWarning() {
  if (Store.backend === 'mem') return '<div class="storage-warn">⚠️ التخزين الدائم غير متاح (يبدو أنك فتحت الملف مباشرة). شغّل خادمًا محليًا (python -m http.server) أو ارفع المنصة على GitHub Pages.</div>';
  if (Store.backend === 'ls') return '<div class="storage-warn">ℹ️ التخزين يعمل عبر localStorage (بديل).</div>';
  return '';
}

async function getStudent() { const a = await Store.getAll('student'); return a[0] || null; }
async function saveStudent(s) { await Store.put('student', s); }

async function getLessonProgress(lessonId, objCount) {
  const all = await Store.getAll('progress');
  let mastered = 0;
  for (const r of all) {
    const lid = r.lessonId || lessonIdFromObjective(r.objectiveId);
    if (lid === lessonId && r.state === 'MASTERED') mastered++;
  }
  return { mastered: Math.min(mastered, objCount), total: objCount };
}
async function isLessonMastered(lessonId, objCount) {
  const p = await getLessonProgress(lessonId, objCount);
  return p.total > 0 && p.mastered >= p.total;
}
async function isChapterBuiltAndMastered(chapterId) {
  const ch = CURRICULUM.chapters.find(c => c.id === chapterId);
  if (!ch) return false;
  if (ch.lessons.length === 0) return false;
  for (const l of ch.lessons) {
    if (!l.built) return false;
    if (!(await isLessonMastered(lessonIdFromCode(l.code), l.objCount))) return false;
  }
  return true;
}
async function isChapterUnlocked(chapterId) {
  if (chapterId === 'A') return true;
  const idx = CURRICULUM.chapters.findIndex(c => c.id === chapterId);
  if (idx <= 0) return false;
  return await isChapterBuiltAndMastered(CURRICULUM.chapters[idx - 1].id);
}
async function isLessonUnlocked(chapterId, lessonN) {
  if (!(await isChapterUnlocked(chapterId))) return false;
  if (lessonN === 1) return true;
  const ch = CURRICULUM.chapters.find(c => c.id === chapterId);
  const prev = ch.lessons.find(l => l.n === lessonN - 1);
  if (!prev || !prev.built) return false;
  return await isLessonMastered(lessonIdFromCode(prev.code), prev.objCount);
}
async function getChapterProgress(chapterId) {
  const ch = CURRICULUM.chapters.find(c => c.id === chapterId);
  let mastered = 0, total = 0;
  for (const l of ch.lessons) {
    if (!l.built) continue;
    const p = await getLessonProgress(lessonIdFromCode(l.code), l.objCount);
    mastered += p.mastered; total += p.total;
  }
  return { mastered, total };
}

async function ensureAutoCertificates(student) {
  if (!student) return;
  const certs = await Store.getAll('certificates');
  let changed = false;
  for (const ch of CURRICULUM.chapters) {
    if (!(await isChapterBuiltAndMastered(ch.id))) continue;
    const existing = certs.find(c => c.type === 'chapter' && c.chapterId === ch.id);
    if (!existing) {
      const cert = {
        id: genCertId('CH', ch.id), type: 'chapter', chapterId: ch.id,
        chapterTitle: ch.title, studentName: student.name, issuedAt: Date.now()
      };
      await Store.put('certificates', cert);
      certs.push(cert); changed = true;
    }
  }
  const builtLessons = CURRICULUM.chapters.flatMap(ch => ch.lessons).filter(l => l.built);
  if (builtLessons.length > 0) {
    let allDone = true;
    for (const ch of CURRICULUM.chapters) {
      const builtChLessons = ch.lessons.filter(l => l.built);
      if (builtChLessons.length === 0) continue;
      if (builtChLessons.length !== ch.lessons.length) { allDone = false; break; }
      if (!(await isChapterBuiltAndMastered(ch.id))) { allDone = false; break; }
    }
    if (allDone) {
      const existing = certs.find(c => c.type === 'course');
      if (!existing) {
        const cert = {
          id: genCertId('CO', 'K21'), type: 'course', courseName: CURRICULUM.course,
          studentName: student.name, issuedAt: Date.now()
        };
        await Store.put('certificates', cert);
        certs.push(cert); changed = true;
      }
    }
  }
  return changed;
}

const view = document.getElementById('view');
const btnSettings = document.getElementById('btn-settings');
const btnChangeName = document.getElementById('btn-change-name');

async function boot() {
  try {
    await Store.open();
    document.getElementById('storage-backend').textContent =
      Store.backend === 'idb' ? 'IndexedDB (دائم)' :
      Store.backend === 'ls' ? 'localStorage (بديل)' : 'ذاكرة مؤقتة';
    const student = await getStudent();
    if (!student) { renderWelcome(); return; }
    btnSettings.classList.remove('hidden');
    btnChangeName.classList.remove('hidden');
    await ensureAutoCertificates(student);
    await renderDashboard();
    document.addEventListener('visibilitychange', function() { if (!document.hidden) renderDashboard(); });
    window.addEventListener('focus', function() { renderDashboard(); });
  } catch (e) {
    view.innerHTML = '<div class="card"><h2>خطأ</h2><p>' + escapeHtml(e.message || String(e)) + '</p></div>';
  }
}

function renderWelcome() {
  view.innerHTML = storageWarning() + `
    <div class="card welcome-card">
      <h2 style="margin-top:0;color:var(--primary)">مرحبًا بك في منصة قطابري الخيرية لإتقان كيمياء 2-1</h2>
      <p>منصة تعلّم إتقاني لمقرر كيمياء 2-1 (نظام المسارات). لا تنتقل من درس حتى تُتقن الذي قبله.</p>
      <p class="muted"><bdi>7</bdi> فصول · <bdi>27</bdi> درسًا · <bdi>${TOTAL_OBJECTIVES}</bdi> هدفًا تعليميًا</p>
      <p class="muted">لا تسجيل، لا بريد، لا تتبع. بياناتك تُحفظ في متصفحك فقط.</p>
      <h3>ما اسمك؟</h3>
      <input id="name-input" type="text" maxlength="50" placeholder="اكتب اسمك هنا" style="width:100%;padding:.8rem;border:1px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:1rem;margin-bottom:1rem">
      <button id="btn-start" class="primary" style="width:100%">ابدأ الآن</button>
    </div>`;
  document.getElementById('btn-start').addEventListener('click', async () => {
    const name = document.getElementById('name-input').value.trim();
    if (name.length < 2) { alert('اكتب اسمًا لا يقل عن حرفين'); return; }
    const student = { id: 'stu-' + Date.now(), name: name, createdAt: Date.now() };
    await saveStudent(student);
    btnSettings.classList.remove('hidden');
    btnChangeName.classList.remove('hidden');
    await ensureAutoCertificates(student);
    await renderDashboard();
  });
}

async function renderDashboard() {
  const student = await getStudent();
  if (!student) { renderWelcome(); return; }

  let builtMastered = 0, builtTotal = 0, builtLessonsCount = 0;
  for (const ch of CURRICULUM.chapters) {
    for (const l of ch.lessons) {
      if (!l.built) continue;
      builtLessonsCount++;
      const p = await getLessonProgress(lessonIdFromCode(l.code), l.objCount);
      builtMastered += p.mastered; builtTotal += p.total;
    }
  }
  const builtPct = builtTotal > 0 ? Math.round(builtMastered / builtTotal * 100) : 0;
  const overallPct = Math.round(builtMastered / TOTAL_OBJECTIVES * 100);

  const allProgress = await Store.getAll('progress');
  let lastMastered = null;
  for (const r of allProgress) {
    if (r.state === 'MASTERED' && r.masteredAt) {
      if (!lastMastered || r.masteredAt > lastMastered.masteredAt) lastMastered = r;
    }
  }
  const certs = await Store.getAll('certificates');

  let lessonsHtml = '<h2>الفصول والدروس</h2>';
  for (const ch of CURRICULUM.chapters) {
    const unlocked = await isChapterUnlocked(ch.id);
    const chapterMastered = await isChapterBuiltAndMastered(ch.id);
    const isOpen = unlocked;
    let badgeText, badgeClass;
    if (chapterMastered) { badgeText = '✓ مكتمل'; badgeClass = 'status-mastered'; }
    else if (unlocked) { badgeText = 'متاح'; badgeClass = 'status-available'; }
    else { badgeText = '🔒 مقفل'; badgeClass = 'status-locked'; }

    lessonsHtml += '<div class="chapter-group ' + (isOpen ? 'open' : 'locked') + '" data-chapter="' + ch.id + '">';
    lessonsHtml += '<button class="chapter-toggle ' + (unlocked ? '' : 'locked') + '" type="button" data-toggle="' + ch.id + '">';
    lessonsHtml += '<div style="flex:1;text-align:right" dir="rtl"><span class="chapter-code ltr">C-' + ch.id + '</span><span class="chapter-name">الفصل ' + ch.label + '</span><div class="chapter-meta-small">' + escapeHtml(ch.title) + '</div></div>';
    lessonsHtml += '<div style="display:flex;align-items:center;gap:.4rem"><span class="lesson-status-mini ' + badgeClass + '">' + badgeText + '</span><span class="chapter-chevron">▼</span></div>';
    lessonsHtml += '</button><div class="chapter-lessons">';

    for (const l of ch.lessons) {
      const lid = lessonIdFromCode(l.code);
      const lessonUnlocked = unlocked && (await isLessonUnlocked(ch.id, l.n));
      const lp = await getLessonProgress(lid, l.objCount);
      const lessonMastered = lessonUnlocked && lp.mastered >= lp.total;

      let rowClass = 'locked', statusClass = 'status-locked', statusText = '🔒 مقفل', href = '';
      if (!l.built) { rowClass = 'preparing'; statusClass = 'status-preparing'; statusText = '⏳ قيد الإعداد'; }
      else if (lessonMastered) { rowClass = 'mastered'; statusClass = 'status-mastered'; statusText = '✓ متقن'; href = l.file; }
      else if (lessonUnlocked) { rowClass = 'available'; statusClass = 'status-available'; statusText = 'ابدأ <bdi>→</bdi>'; href = l.file; }

      const title = !l.built ? 'قيد الإعداد' :
                    (!lessonUnlocked ? 'يتطلب إتقان الدرس السابق' :
                     (lessonMastered ? 'افتح للمراجعة' : 'افتح الدرس'));

      lessonsHtml += '<' + (href ? 'a' : 'button') + (href ? ' href="' + href + '"' : ' type="button"') + ' class="lesson-btn ' + rowClass + '" title="' + escapeHtml(title) + '">';
      lessonsHtml += '<span class="lesson-mini-code ltr">' + l.code + '</span>';
      lessonsHtml += '<div class="lesson-info-mini" dir="rtl"><div class="lesson-name-mini">' + escapeHtml(l.title) + '</div><div class="lesson-meta-mini"><bdi>' + l.objCount + '</bdi> أهداف</div>';
      if (l.built && lessonUnlocked) {
        const pct = Math.round(lp.mastered / lp.total * 100);
        lessonsHtml += '<div class="mini-pbar"><div style="width:' + pct + '%"></div></div>';
      }
      lessonsHtml += '</div>';
      lessonsHtml += '<span class="lesson-status-mini ' + statusClass + '">' + statusText + '</span>';
      lessonsHtml += '</' + (href ? 'a' : 'button') + '>';
    }
    lessonsHtml += '</div></div>';
  }

  let reportHtml = '<div class="print-only"><h1>منصة قطابري الخيرية لإتقان كيمياء 2-1</h1><div class="print-sub">تقرير تقدم الطالب · المعلم محمد قطابري راجحي · مجمع العز التعليمي</div></div>';
  reportHtml += '<div class="report-header"><h2>تقرير التقدم</h2><div class="report-actions"><button id="btn-refresh" title="تحديث">🔄 تحديث</button><button id="btn-print" class="primary" title="طباعة">🖨️ طباعة</button></div></div>';

  reportHtml += '<div class="report-card">';
  reportHtml += '<h3 class="report-name" dir="auto">' + escapeHtml(student.name) + '</h3>';
  reportHtml += '<div class="report-dates">' + todayHijri() + ' هـ — ' + todayGreg() + ' م</div>';
  reportHtml += '<div class="report-total"><span class="report-total-label">التقدم العام</span><span class="report-total-value ltr">' + builtMastered + ' / ' + builtTotal + '</span></div>';
  reportHtml += '<div class="progress-bar big"><div style="width:' + builtPct + '%"></div></div>';
  reportHtml += '<div class="report-total-note"><bdi>' + builtPct + '%</bdi> من الأهداف المبنية · من أصل <bdi>' + TOTAL_OBJECTIVES + '</bdi> هدفًا في المنهج الكامل (<bdi>' + overallPct + '%</bdi>) · <bdi>' + builtLessonsCount + ' / 27</bdi> درسًا مبنيًا</div>';
  reportHtml += '</div>';

  if (builtLessonsCount === 0) {
    reportHtml += '<div class="report-card"><div class="empty-state"><div class="icon">📚</div><h3>لم تُبنَ أي دروس بعد</h3><p>هذه الصفحة الرئيسية جاهزة لاستقبال دروس كيمياء 2-1. عند بناء ملف درس (مثل <span class="code-hint ltr">C21A1.html</span>)، غيّر في الكود <span class="code-hint ltr">built: false</span> إلى <span class="code-hint ltr">built: true</span> وسيظهر تلقائيًا هنا.</p><p class="muted">المنهج الكامل: <bdi>7</bdi> فصول · <bdi>27</bdi> درسًا · <bdi>' + TOTAL_OBJECTIVES + '</bdi> هدفًا</p></div></div>';
  }

  if (lastMastered) {
    reportHtml += '<div class="last-mastered"><div class="last-mastered-title">✓ آخر إتقان</div><div class="last-mastered-text">الهدف <bdi>' + escapeHtml(lastMastered.objectiveId) + '</bdi> · ' + formatDate(lastMastered.masteredAt) + '</div></div>';
  }

  if (certs.length > 0) {
    reportHtml += '<div class="report-card"><div class="report-section-title">الشهادات المكتسبة</div><ul class="cert-list">';
    for (const c of certs) {
      let title = '';
      if (c.type === 'lesson') title = 'شهادة إتمام درس ' + (c.lessonCode || c.lessonId || '');
      else if (c.type === 'chapter') title = 'شهادة إتمام الفصل ' + (c.chapterId || '') + ' · ' + (c.chapterTitle || '');
      else if (c.type === 'course') title = 'شهادة إتمام مقرر ' + (c.courseName || 'كيمياء 2-1');
      else title = c.type;
      reportHtml += '<li class="cert-item"><div class="cert-item-title">' + escapeHtml(title) + '</div><div class="cert-item-code ltr">' + escapeHtml(c.id || '') + '</div></li>';
    }
    reportHtml += '</ul></div>';
  }

  reportHtml += '<div class="report-card"><div class="report-section-title">تقدم الفصول</div>';
  for (const ch of CURRICULUM.chapters) {
    const cp = await getChapterProgress(ch.id);
    const pct = cp.total > 0 ? Math.round(cp.mastered / cp.total * 100) : 0;
    const complete = cp.total > 0 && cp.mastered >= cp.total;
    const builtInChapter = ch.lessons.filter(l => l.built).length;
    reportHtml += '<div class="chapter-progress ' + (complete ? 'complete' : '') + '">';
    reportHtml += '<span class="chapter-progress-name"><span class="ltr">C-' + ch.id + '</span> · ' + escapeHtml(ch.title) + ' <span class="muted">(<bdi>' + builtInChapter + '/' + ch.lessons.length + '</bdi> مبني)</span></span>';
    reportHtml += '<div class="chapter-progress-bar"><div style="width:' + pct + '%"></div></div>';
    reportHtml += '<span class="chapter-progress-val"><bdi>' + (cp.total > 0 ? cp.mastered + '/' + cp.total : '—') + '</bdi></span>';
    reportHtml += '</div>';
  }
  reportHtml += '</div>';

  reportHtml += '<div class="report-card"><div class="report-section-title">تفاصيل الدروس</div>';
  for (const ch of CURRICULUM.chapters) {
    reportHtml += '<div style="margin-bottom:.6rem"><div class="muted" style="font-weight:600;margin-bottom:.3rem"><span class="ltr">C-' + ch.id + '</span> · ' + escapeHtml(ch.title) + '</div>';
    for (const l of ch.lessons) {
      const lid = lessonIdFromCode(l.code);
      const lp = await getLessonProgress(lid, l.objCount);
      const pct = lp.total > 0 ? Math.round(lp.mastered / lp.total * 100) : 0;
      const complete = l.built && lp.mastered >= lp.total;
      reportHtml += '<div class="chapter-progress ' + (complete ? 'complete' : '') + '" style="padding:.35rem 0">';
      reportHtml += '<span class="chapter-progress-name" style="font-weight:400;font-size:.85rem"><span class="ltr">' + l.code + '</span> · ' + escapeHtml(l.title) + (l.built ? '' : ' <span style="color:#7a4f00">(قيد الإعداد)</span>') + '</span>';
      reportHtml += '<div class="chapter-progress-bar"><div style="width:' + (l.built ? pct : 0) + '%"></div></div>';
      reportHtml += '<span class="chapter-progress-val"><bdi>' + (l.built ? lp.mastered + '/' + lp.total : '—') + '</bdi></span>';
      reportHtml += '</div>';
    }
    reportHtml += '</div>';
  }
  reportHtml += '</div>';

  reportHtml += '<div class="print-footer">هذا التقرير صادر من المنصة بناءً على تقدم الطالب المحفوظ على جهازه.<br>المعلم محمد قطابري راجحي — مجمع العز التعليمي</div>';

  view.innerHTML = storageWarning() +
    '<div class="info-banner"><div>📘 <strong>كيمياء 2-1</strong> · <bdi>7</bdi> فصول · <bdi>27</bdi> درسًا · <bdi>' + TOTAL_OBJECTIVES + '</bdi> هدفًا · التخزين في متصفحك فقط</div><div class="muted"><bdi>' + builtLessonsCount + ' / 27</bdi> درسًا مبنيًا</div></div>' +
    '<div class="dashboard"><aside class="lessons-col">' + lessonsHtml + '</aside><section class="report-col">' + reportHtml + '</section></div>';

  view.querySelectorAll('.chapter-toggle[data-toggle]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      const id = btn.getAttribute('data-toggle');
      const group = btn.closest('.chapter-group');
      if (!group || group.classList.contains('locked')) return;
      group.classList.toggle('open');
    });
  });
  const btnRefresh = document.getElementById('btn-refresh');
  const btnPrint = document.getElementById('btn-print');
  if (btnRefresh) btnRefresh.addEventListener('click', function() { renderDashboard(); });
  if (btnPrint) btnPrint.addEventListener('click', function() { window.print(); });
}

btnChangeName.addEventListener('click', async function() {
  const s = await getStudent();
  if (!s) return;
  const newName = prompt('الاسم الجديد:', s.name);
  if (!newName || newName.trim().length < 2) return;
  s.name = newName.trim();
  await saveStudent(s);
  await renderDashboard();
});
btnSettings.addEventListener('click', function() { document.getElementById('modal-settings').classList.add('open'); });

document.getElementById('btn-export').addEventListener('click', async function() {
  const student = await getStudent();
  const data = {
    schema: 'chem21-backup-v1',
    exportedAt: new Date().toISOString(),
    course: CURRICULUM.course,
    student: student,
    progress: await Store.getAll('progress'),
    attempts: await Store.getAll('attempts'),
    certificates: await Store.getAll('certificates')
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'chem21-backup-' + (student ? student.name.replace(/\s+/g, '-') : 'student') + '-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
});
document.getElementById('btn-import').addEventListener('click', function() { document.getElementById('import-file').click(); });
document.getElementById('import-file').addEventListener('change', async function(e) {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (data.schema !== 'chem21-backup-v1') throw new Error('ملف غير متوافق');
    await Store.clear('student'); await Store.clear('progress'); await Store.clear('attempts'); await Store.clear('certificates');
    if (data.student) await Store.put('student', data.student);
    for (const p of data.progress || []) await Store.put('progress', p);
    for (const a of data.attempts || []) { delete a.id; await Store.put('attempts', a); }
    for (const c of data.certificates || []) await Store.put('certificates', c);
    alert('تم الاستيراد بنجاح. سيُعاد تحميل الصفحة.');
    location.reload();
  } catch (err) { alert('فشل: ' + err.message); }
});
document.getElementById('btn-reset').addEventListener('click', async function() {
  if (!confirm('هل أنت متأكد؟ سيُمحى كل شيء نهائيًا.')) return;
  await Store.clear('student'); await Store.clear('progress'); await Store.clear('attempts'); await Store.clear('certificates');
  location.reload();
});

boot();
</script>
